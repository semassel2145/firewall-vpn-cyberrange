name: validate-lab

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Validate repository definitions
        run: python scripts/validate.py
      - name: Smoke-test target services
        run: python scripts/test_target.py
      - name: Compile SEED VPN sample programs
        run: |
          gcc -O2 -o /tmp/vpnserver seed-source/vpnserver.c
          gcc -O2 -o /tmp/vpnclient seed-source/vpnclient.c
